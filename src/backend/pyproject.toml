[project]
name = "app-backend"
version = "0.1.0"
description = "FastAPI backend with OAuth2 authentication and per-user module permissions."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "app-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.uv.sources]
app-contracts = { path = "../contracts", editable = true }

[project.scripts]
app-cli = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../contracts/python"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "contracts", "tests"]

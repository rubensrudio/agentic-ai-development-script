[project]
name = "app-contracts"
version = "0.1.0"
description = "Shared API contracts (Pydantic schemas and permission catalog)."
requires-python = ">=3.12"
dependencies = ["pydantic[email]>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/contracts"]
